

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEASONGO - Vivre sa saison autrement</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#071b36;color:white}
header{text-align:center;padding:28px 15px;background:#102e55}
.logo{font-size:35px;font-weight:bold;color:#49d5ff}
header p{color:#d4eaff}
main{max-width:700px;margin:25px auto;padding:18px}
.panel{background:#12345b;padding:22px;border-radius:16px}
h2{margin-top:0}
label{display:block;margin:14px 0 7px}
input,select{width:100%;padding:14px;border:0;border-radius:9px;font-size:16px}
button{width:100%;padding:15px;margin-top:17px;border:0;border-radius:9px;background:#22c5ef;color:#06213b;font-weight:bold;font-size:16px}
button:active{opacity:.8}
#results{margin-top:22px}
.offer{background:#fff;color:#10233e;border-radius:12px;padding:17px;margin:14px 0}
.offer h3{color:#087da9;margin-top:0}
.tag{display:inline-block;background:#dff6ff;padding:6px 9px;border-radius:6px;margin:4px;font-size:13px}
.details{display:none;margin-top:12px;padding:12px;background:#edf8ff;border-radius:8px}
.small{font-size:13px;color:#c9e6ff;text-align:center}
</style>
</head>
<body>
<header>
<div class="logo">SEASONGO</div>
<p>Vivre sa saison autrement</p>
</header>
<main>
<div class="panel">
<h2>🔎 Trouve ta prochaine saison</h2>
<label>Métier recherché</label>
<input id="job" placeholder="Ex : serveur">
<label>Destination</label>
<input id="place" placeholder="Ex : Tignes">
<label>Logement</label>
<select id="housing">
<option value="yes">Logement obligatoire</option>
<option value="no">Logement non obligatoire</option>
<option value="all">Toutes les offres</option>
</select>
<button onclick="searchOffers()">Lancer la recherche</button>
</div>
<div id="results"></div>
<p class="small">SEASONGO – La saison commence ici.</p>
</main>
<script>
const offers=[
{job:"Serveur",place:"Tignes",housing:true,salary:"Selon expérience",contract:"Saison hiver",description:"Poste de serveur en restauration à Tignes. Contact et conditions à confirmer auprès de l'employeur."},
{job:"Chef de rang",place:"Tignes",housing:true,salary:"À définir",contract:"Saison hiver",description:"Recherche chef de rang pour la saison d'hiver. Logement proposé, modalités à confirmer."},
{job:"Barman",place:"Tignes",housing:false,salary:"Selon expérience",contract:"Saison hiver",description:"Poste de barman en station. Conditions à confirmer auprès de l'établissement."},
{job:"Serveur",place:"Val Thorens",housing:true,salary:"Selon profil",contract:"Saison hiver",description:"Exemple de poste saisonnier. Annonce de démonstration, non vérifiée."},
{job:"Serveur",place:"Avoriaz",housing:true,salary:"À définir",contract:"Saison hiver",description:"Exemple de poste saisonnier. Annonce de démonstration, non vérifiée."}
];
function searchOffers(){
const job=document.getElementById("job").value.trim().toLowerCase();
const place=document.getElementById("place").value.trim().toLowerCase();
const housing=document.getElementById("housing").value;
const results=document.getElementById("results");
let found=offers.filter(o=>
(!job||o.job.toLowerCase().includes(job))&&
(!place||o.place.toLowerCase().includes(place))&&
(housing!=="yes"||o.housing)
);
results.innerHTML="<h2>Résultats de ta recherche</h2>";
if(found.length===0){
results.innerHTML+="<div class='panel'>Aucune offre dans notre démonstration pour ces critères. Essaie une autre destination ou un autre métier.</div>";
return;
}
found.forEach((o,i)=>{
results.innerHTML+=`
<div class="offer">
<h3>${o.job} – ${o.place}</h3>
<span class="tag">${o.housing?"Logement fourni":"Logement non précisé"}</span>
<span class="tag">${o.contract}</span>
<p><b>Salaire :</b> ${o.salary}</p>
<button onclick="showDetails(${i})">Voir l'annonce</button>
<div class="details" id="detail${i}">
<p>${o.description}</p>
<p><b>Important :</b> Offre de démonstration SEASONGO, pas une annonce d'emploi réelle vérifiée.</p>
</div>
</div>`;
});
}
function showDetails(i){
const box=document.getElementById("detail"+i);
box.style.display=box.style.display==="block"?"none":"block";
}
</script>
</body>
</html>
