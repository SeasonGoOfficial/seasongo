
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEASONGO - Vivre sa saison autrement</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#071629;color:white}
header{background:#102b49;padding:25px 15px;text-align:center}
.logo{font-size:34px;font-weight:bold;color:#39d5e8;letter-spacing:2px}
header p{color:#c4d8e9;margin-bottom:0}
main{max-width:700px;margin:auto;padding:18px}
h2{color:#39d5e8}
.card{background:#102b49;padding:18px;border-radius:14px;margin:15px 0;border:1px solid #244b6b}
input,select{width:100%;padding:14px;margin:7px 0;border-radius:8px;border:0;font-size:16px}
button{background:#20c6d9;color:#061629;border:0;border-radius:9px;padding:13px 18px;font-size:16px;font-weight:bold;cursor:pointer;width:100%;margin-top:10px}
button.secondary{background:#284966;color:white}
.offer{cursor:pointer;border:1px solid #39d5e8}
.offer h3{color:#39d5e8;margin-top:0}
.offer:active{transform:scale(.99)}
.tag{display:inline-block;background:#174e56;color:#70f3dd;padding:6px 9px;border-radius:20px;font-size:12px;margin:4px 2px}
.detail{line-height:1.8;color:#e1edf7}
.hidden{display:none}
.back{margin-bottom:15px}
footer{text-align:center;color:#8fa9c0;padding:25px;font-size:13px}
</style>
</head>
<body>
<header>
<div class="logo">SEASONGO</div>
<p>Vivre sa saison autrement</p>
</header>
<main>
<section id="search">
<div class="card">
<h2>🔎 Trouve ta saison</h2>
<label>Métier recherché</label>
<select id="job">
<option value="">Tous les métiers</option>
<option>Serveur</option>
<option>Chef de rang</option>
<option>Barman</option>
<option>Cuisinier</option>
<option>Plongeur</option>
<option>Réceptionniste</option>
</select>
<label>Destination</label>
<input id="place" placeholder="Ex : Tignes, Avoriaz, Megève...">
<label>Logement</label>
<select id="housing">
<option value="any">Indifférent</option>
<option value="yes">Logement obligatoire</option>
</select>
<button onclick="searchOffers()">Lancer la recherche</button>
</div>
<div id="results">
<h2>Offres disponibles</h2>
<div id="offers"></div>
</div>
</section>

<section id="details" class="hidden">
<button class="secondary back" onclick="backToResults()">← Retour aux offres</button>
<div class="card">
<span class="tag">OFFRE DE DÉMONSTRATION</span>
<h2 id="detailTitle"></h2>
<div class="detail" id="detailContent"></div>
<button onclick="applyOffer()">Postuler à cette offre</button>
</div>
</section>
</main>
<footer>SEASONGO © 2026 — La saison commence ici.</footer>

<script>
const demoOffers=[
{job:"Serveur",place:"Tignes",salary:"2 000 € brut / mois",housing:"Logement fourni gratuitement",meals:"Repas fournis",hours:"39 heures par semaine",contract:"CDD saisonnier de décembre à avril",experience:"Débutant accepté",description:"Rejoignez une équipe dynamique dans un établissement de montagne."},
{job:"Chef de rang",place:"Saint-Gervais",salary:"2 700 € brut / mois",housing:"Logement fourni",meals:"Repas fournis",hours:"À définir avec l'employeur",contract:"CDD saisonnier",experience:"Expérience souhaitée",description:"Participez à une belle saison hivernale au sein d'une équipe accueillante."},
{job:"Barman",place:"Avoriaz",salary:"2 100 € brut / mois",housing:"Logement fourni",meals:"Repas fournis",hours:"35 à 39 heures par semaine",contract:"CDD saisonnier",experience:"Expérience appréciée",description:"Service au bar dans une station de ski dynamique."}
];
let visibleOffers=[];

function searchOffers(){
const job=document.getElementById("job").value.toLowerCase();
const place=document.getElementById("place").value.trim().toLowerCase();
const housing=document.getElementById("housing").value;
visibleOffers=demoOffers.filter(o=>
(!job||o.job.toLowerCase().includes(job))&&
(!place||o.place.toLowerCase().includes(place))&&
(housing!=="yes"||o.housing.toLowerCase().includes("fourni"))
);
renderOffers();
}

function renderOffers(){
const container=document.getElementById("offers");
container.innerHTML="";
if(!visibleOffers.length){
container.innerHTML="<p>Aucune offre de démonstration ne correspond à tes critères.</p>";
return;
}
visibleOffers.forEach((offer,index)=>{
const div=document.createElement("div");
div.className="card offer";
div.innerHTML="<h3>"+offer.job+" — "+offer.place+"</h3>"+
"<strong>"+offer.salary+"</strong><br>"+
"<span class='tag'>"+offer.housing+"</span>"+
"<span class='tag'>Offre de démonstration</span>"+
"<p>"+offer.description+"</p><strong>Voir les détails →</strong>";
div.addEventListener("click",()=>openOffer(index));
container.appendChild(div);
});
}

function openOffer(index){
const offer=visibleOffers[index];
document.getElementById("detailTitle").textContent=offer.job+" — "+offer.place;
document.getElementById("detailContent").innerHTML=
"<p><strong>Salaire :</strong> "+offer.salary+"</p>"+
"<p><strong>Logement :</strong> "+offer.housing+"</p>"+
"<p><strong>Repas :</strong> "+offer.meals+"</p>"+
"<p><strong>Horaires :</strong> "+offer.hours+"</p>"+
"<p><strong>Contrat :</strong> "+offer.contract+"</p>"+
"<p><strong>Expérience :</strong> "+offer.experience+"</p>"+
"<p><strong>Description :</strong> "+offer.description+"</p>";
document.getElementById("search").classList.add("hidden");
document.getElementById("details").classList.remove("hidden");
window.scrollTo(0,0);
}

function backToResults(){
document.getElementById("details").classList.add("hidden");
document.getElementById("search").classList.remove("hidden");
window.scrollTo(0,0);
}

function applyOffer(){
alert("Cette offre est une démonstration SEASONGO. Les candidatures seront disponibles lorsque les employeurs seront connectés à la plateforme.");
}
renderOffers();
</script>
</body>
</html>
