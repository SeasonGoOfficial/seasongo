
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEASONGO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07152e;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:25px 15px;background:#102b50}
.logo{font-size:35px;font-weight:bold;color:#42d9ff}
header p{color:#c8eaff}
main{padding:18px;max-width:650px;margin:auto}
h2{color:#42d9ff}
.card{background:#13294a;padding:18px;border-radius:15px;margin:15px 0}
input,select{width:100%;padding:14px;margin:8px 0;border:0;border-radius:8px;font-size:16px}
button{background:#12bce5;color:#06152d;border:0;padding:14px;border-radius:9px;font-weight:bold;font-size:16px;width:100%;margin-top:10px}
nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
nav button{background:#203d63;color:white}
.result{border-bottom:1px solid #456080;padding:12px 0}
.small{color:#a9c7e5;font-size:13px}
</style>
</head>
<body>
<header>
<div class="logo">SEASONGO</div>
<p>Vivre sa saison autrement ❄️</p>
<p>Le monde des saisonniers, enfin réuni !</p>
</header>

<main>
<div class="card">
<h2>🔎 Trouve ton emploi saisonnier</h2>
<input id="job" placeholder="Métier recherché (serveur, cuisinier...)">
<input id="place" placeholder="Station ou ville souhaitée">
<select id="housing">
<option value="">Logement : indifférent</option>
<option value="yes">Logement fourni obligatoire</option>
</select>
<button onclick="searchJobs()">LANCER LA RECHERCHE</button>
<div id="results"></div>
</div>

<h2>🌍 Explore SEASONGO</h2>
<nav>
<button onclick="show('verification')">🛡️ Offres vérifiées</button>
<button onclick="show('budget')">💰 Mon budget</button>
<button onclick="show('geo')">📍 Compagnon géographique</button>
<button onclick="show('sorties')">🎉 Sorties en station</button>
<button onclick="show('chat')">💬 Communauté</button>
<button onclick="show('bonsplans')">🎿 Bons plans</button>
</nav>
<div class="card" id="info">
<h2>Bienvenue sur SEASONGO !</h2>
<p>Ta prochaine saison commence ici.</p>
</div>
<p class="small">SEASONGO – La confiance avant tout. Les offres affichées devront être vérifiées avant publication.</p>
</main>

<script>
function searchJobs(){
let job=document.getElementById('job').value.trim();
let place=document.getElementById('place').value.trim();
let housing=document.getElementById('housing').value;
let results=document.getElementById('results');

if(!job&&!place){
results.innerHTML='<p>Indique un métier ou une destination pour commencer.</p>';
return;
}

let query=[job,place,housing==='yes'?'logement fourni':''].filter(Boolean).join(' ');
let url='https://www.google.com/search?q='+encodeURIComponent('emploi saisonnier '+query);

results.innerHTML='<p>Recherche préparée pour : <b>'+query+'</b></p><button onclick="window.open(\''+url+'\',\'_blank\')">VOIR LES OFFRES DISPONIBLES</button><p class="small">Les résultats externes ne sont pas encore vérifiés par SEASONGO.</p>';
}

function show(section){
let content={
verification:['🛡️','La confiance avant tout','Notre objectif : vérifier l’identité des employeurs et l’authenticité de chaque annonce.'],
budget:['💰','Ton budget saison','Bientôt : estime ton salaire, tes dépenses et tes économies possibles.'],
geo:['📍','Compagnon géographique','Retrouve les informations utiles autour de ta future station.'],
sorties:['🎉','La vie en station','Découvre les soirées, événements et activités près de toi.'],
chat:['💬','Communauté SEASONGO','Un espace pour échanger, partager des conseils et organiser du covoiturage.'],
bonsplans:['🎿','Bons plans','Retrouve les avantages et réductions pour les saisonniers.']
};
let c=content[section];
document.getElementById('info').innerHTML='<h2>'+c[0]+' '+c[1]+'</h2><p>'+c[2]+'</p>';
}
</script>
</body>
</html>
